[workspace]
resolver = "2"
exclude = ["crates/relay-ipc/fuzz"]
members = ["crates/relay-core", "crates/relay-ipc", "switchyardd", "switchyardctl", "plugins/mqtt", "relayfabric-ui"]
# relayfabric-ui (web admin UI + proxy) is an OPTIONAL component: it's a
# workspace member so it shares deps and the lockfile, but excluded from the
# default set so a bare `cargo build --release` produces the minimal daemon +
# CLI + MQTT plugin. Build the UI explicitly with `-p relayfabric-ui`.
default-members = ["crates/relay-core", "crates/relay-ipc", "switchyardd", "switchyardctl", "plugins/mqtt"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
ciborium = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
ed25519-dalek = "2"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rumqttc = { version = "0.25", default-features = false }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
snow = "0.10.0"
curve25519-dalek = { version = "4.1.3", default-features = false }
relay-core = { path = "crates/relay-core", package = "relayfabric-core", version = "0.4.1" }
relay-ipc = { path = "crates/relay-ipc", package = "relayfabric-ipc", version = "0.4.1" }
