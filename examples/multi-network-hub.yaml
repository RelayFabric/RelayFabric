# Recipe: a multi-network hub — several plugins fanning into shared routes.
# Shows deny-by-default routing: nothing bridges until a route names it.
# Here an MQTT topic and a Nostr channel cross-post to each other, and both
# also mirror into an LXMF channel (one-way, for an off-grid audience).
# Edit: data_dir, plugin command paths, broker/relays, and channel details.
#   switchyardd --config examples/multi-network-hub.yaml --check-config
node:
  name: hub
  data_dir: /var/lib/relayfabric

plugins:
  mqtt:
    enabled: true
    command: relayfabric-mqtt
    config:
      broker: mqtt://127.0.0.1:1883
      client_id: relayfabric-hub

  nostr:
    enabled: true
    command: /opt/relayfabric/.venv/bin/python /opt/relayfabric/plugins/nostr/relayfabric-nostr
    config:
      identity_file: /var/lib/relayfabric/nostr.nsec
      relays: ["wss://relay.example.com"]
      channels:
        townsquare:
          filter: { kinds: [1], "#t": ["townsquare"] }
          publish_tags: [["t", "townsquare"]]

  lxmf:
    enabled: true
    command: /opt/relayfabric/.venv/bin/python /opt/relayfabric/plugins/lxmf/relayfabric-lxmf
    config:
      display_name: "Hub"
      storage: /var/lib/relayfabric/lxmf
      channels:
        - name: townsquare
          members: []
          open: true

routes:
  # MQTT <-> Nostr, both directions.
  - name: mqtt-to-nostr
    sources: ["mqtt:townsquare/in"]
    destinations: ["nostr:townsquare"]
  - name: nostr-to-mqtt
    sources: ["nostr:townsquare"]
    destinations: ["mqtt:townsquare/out"]
  # Mirror both into LXMF (one-way to the off-grid audience).
  - name: mirror-to-lxmf
    sources: ["mqtt:townsquare/in", "nostr:townsquare"]
    destinations: ["lxmf:townsquare"]

ttl_default_secs: 86400
dedup_ttl_secs: 86400
retention_secs: 86400
hop_limit: 8
