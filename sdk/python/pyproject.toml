[project]
name = "relayfabric-sdk"
version = "0.4.0"
description = "RelayFabric Python plugin SDK: Plugin Protocol v1 frame codec, main-loop scaffold, bridge plumbing, sent-cache, and test harness."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["cbor2"]

[project.urls]
Homepage = "https://docs.relayfabric.org"
Repository = "https://github.com/RelayFabric/RelayFabric"

# Not pip-installed by anything in-repo: plugins and their tests consume
# this package via a sys.path insert to ../../sdk/python. `pip install -e
# sdk/python` works for out-of-repo consumption but is not required.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["relayfabric_sdk*"]
