\* For the trace check of SendQueueTrace.tla against a log that trace_run.py wrote.
\* The constants are the ones that trace_run.py runs the code with.
CONSTANTS
  Corrs = {1, 2}
  MaxQueue = 2
  MaxFrames = 5
  Faults = {}
INIT TraceInit
NEXT TraceNext
INVARIANTS
  OneSendPerCorr
  NoStuckCorr
  InOrder
  DrainedAtStop
  BusyAnswered
  Bounded
