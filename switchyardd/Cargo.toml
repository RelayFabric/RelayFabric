[package]
name = "switchyardd"
version.workspace = true
description = "RelayFabric daemon: policy-controlled routing fabric bridging mesh, radio, and Internet messaging networks"
edition.workspace = true
license.workspace = true

[dependencies]
relay-core.workspace = true
relay-ipc.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
rusqlite.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
axum.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
snow.workspace = true
ciborium.workspace = true
curve25519-dalek.workspace = true
libc.workspace = true
# Task 2 (design §2) license+offline gate, PASSED: `utoipa-swagger-ui` and
# every one of its ~53 newly-locked transitive deps (rust-embed, zip,
# walkdir, url/idna/ICU, mime_guess, ...) are MIT / Apache-2.0 / 0BSD /
# Unlicense / Zlib / Unicode-3.0 (recorded verbatim in the Task 2 report;
# no AGPL/GPL/restrictive license anywhere in the tree). The `vendored`
# feature pulls in `utoipa-swagger-ui-vendored` (MIT/Apache-2.0), which
# embeds the actual Swagger UI dist zip as `include_bytes!` at ITS OWN
# publish time -- our build.rs extracts THAT local zip, never downloads
# one (the crate's own doc comment: "provides the means to serve Swagger
# UI in sandboxed environments where network access ... is not possible").
# Confirmed empirically: `cargo build -p switchyardd --offline` succeeds
# after `cargo fetch`, which a build-time network fetch would not survive.
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
# Task 1 (design §1, cycle H sealed routing) license gate, PASSED: the only
# two NET-NEW crates this pulls in -- `crypto_box` itself and its
# `crypto_secretbox` dependency -- are both `Apache-2.0 OR MIT` (recorded
# verbatim in the Task 1 report; `cargo metadata` confirmed). Every other
# dependency `crypto_box` needs for `ChaChaBox` (chacha20, chacha20poly1305,
# curve25519-dalek, ...) was ALREADY locked via cycle F's `snow`, so this
# adds zero additional transitive crates beyond those two. `default-features
# = false` drops the unused `salsa20`/`SalsaBox`/`seal` machinery (this
# codebase only ever constructs `ChaChaBox`, X25519 + XChaCha20-Poly1305 per
# design §2) -- `chacha20`/`std`/`alloc`/`getrandom`/`rand_core` are the
# minimum feature set that compiles `ChaChaBox::new`/`.encrypt`/`.decrypt`.
crypto_box = { version = "0.9.1", default-features = false, features = ["chacha20", "std", "alloc", "getrandom", "rand_core"] }
# Final-review polish (cycle H, sealed routing): promoted from an existing
# transitive dep (already locked via crypto_box/curve25519-dalek/
# ed25519-dalek, `Apache-2.0 OR MIT`, zero new crates in the tree) to a
# direct one, so `fed::sealkey::SealedKey::load_or_create` can zeroize its
# own transient key-generation buffer rather than reaching for a crate
# Cargo wouldn't otherwise let it name directly.
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
http-body-util.workspace = true
# test-util adds tokio::time::pause/advance and #[tokio::test(start_paused
# = true)] (Task 4 review fix round 1: fake-clock coverage for run_conn's
# I/O timeouts) -- a feature-only addition to the SAME tokio dependency
# already in [dependencies] (Cargo unifies features across dependency
# kinds for a shared package), so it only ever applies to test builds,
# never a production `cargo build`, and pulls in no new crate.
tokio = { version = "1", features = ["test-util"] }

# `cargo deb -p switchyardd --no-build` after a workspace release build
# (v0.4 cycle D): one .deb carrying the daemon, the CLI, the Rust MQTT
# plugin, and the hardened systemd units.
[package.metadata.deb]
name = "relayfabric"
maintainer = "RelayFabric contributors"
copyright = "RelayFabric contributors, Apache-2.0"
extended-description = "Privacy-first, protocol-pluggable gateway for bridging decentralized networks (Reticulum/LXMF, Meshtastic, MeshCore, Signal, Nostr, Bitchat, MQTT)."
assets = [
  ["target/release/switchyardd", "usr/bin/", "755"],
  ["target/release/switchyardctl", "usr/bin/", "755"],
  ["target/release/relayfabric-mqtt", "usr/bin/", "755"],
  ["../deploy/systemd/switchyardd.service", "lib/systemd/system/", "644"],
  ["../deploy/systemd/relayfabric-plugin@.service", "lib/systemd/system/", "644"],
  ["../docs/relayfabric.example.yaml", "etc/relayfabric/relayfabric.yaml.example", "644"],
]
