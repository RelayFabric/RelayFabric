[package]
name = "switchyardd"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
relay-core.workspace = true
relay-ipc.workspace = true
serde.workspace = true
serde_bytes.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
rusqlite.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
axum.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
snow.workspace = true
ciborium.workspace = true
curve25519-dalek.workspace = true
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
http-body-util.workspace = true
# test-util adds tokio::time::pause/advance and #[tokio::test(start_paused
# = true)] (Task 4 review fix round 1: fake-clock coverage for run_conn's
# I/O timeouts) -- a feature-only addition to the SAME tokio dependency
# already in [dependencies] (Cargo unifies features across dependency
# kinds for a shared package), so it only ever applies to test builds,
# never a production `cargo build`, and pulls in no new crate.
tokio = { version = "1", features = ["test-util"] }
