# cargo-deny policy (v0.4 cycle A). License posture: permissive only —
# copyleft (GPL/AGPL/LGPL/EPL) is rejected outright, matching the project's
# standing dependency policy. MPL-2.0 is deliberately NOT allowed either;
# add it here only with an explicit decision.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "Unicode-3.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[advisories]
# cargo-deny >= 0.16 fails the gate on vulnerabilities AND on unmaintained
# crates (there is no "warn" tier for the latter any more); only yanked
# versions are downgraded to a warning here. If an unmaintained advisory
# ever has to be carried, add it to `ignore` with a reason and a date.
yanked = "warn"

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
