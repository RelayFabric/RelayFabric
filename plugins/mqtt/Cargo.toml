[package]
name = "relayfabric-mqtt"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "relayfabric-mqtt"
path = "src/main.rs"

[dependencies]
relay-core.workspace = true
relay-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
# Platform TLS (OpenSSL via native-tls) rather than rumqttc's rustls feature:
# that feature pins a rustls-webpki release with open advisories that
# cargo-deny rightly refuses, and the platform stack is patched by the OS.
rumqttc = { workspace = true, features = ["use-native-tls"] }
native-tls = "0.2"
tracing.workspace = true
tracing-subscriber.workspace = true
