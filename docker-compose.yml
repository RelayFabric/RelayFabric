# RelayFabric with an optional local MQTT broker.
#
#   mkdir -p config && cp docs/relayfabric.example.yaml config/relayfabric.yaml
#   # edit config/relayfabric.yaml: point plugin `command`s at the in-image
#   # paths (/opt/venv/bin/python /opt/relayfabric/plugins/<name>/relayfabric-<name>)
#   # and set node.data_dir: /data ; brokers reachable as mqtt://mosquitto:1883
#   docker compose up -d
#
# Inspect: docker compose exec switchyardd switchyardctl --socket /data/admin.sock status

services:
  switchyardd:
    build: .
    image: relayfabric:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./config:/config:ro     # your relayfabric.yaml
      - relayfabric-data:/data  # queue db, CAS attachments, admin.sock, plugin identities
    healthcheck:
      test: ["CMD", "switchyardctl", "--socket", "/data/admin.sock", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Federation listens on a TCP port only if you configure it; publish it here:
    # ports:
    #   - "8443:8443"

  # Optional web admin UI — reverse-proxies the daemon's admin socket with
  # WebAuthn/passkeys + RBAC. Shares the data volume to reach /data/admin.sock.
  # `--no-auth` here is for a LOCAL first look only (published to 127.0.0.1);
  # for real/remote use drop it, front it with TLS, and set --rp-id +
  # --allowed-host (see docs/webui-notes.md "Remote access").
  relayfabric-ui:
    image: relayfabric:latest
    restart: unless-stopped
    depends_on:
      - switchyardd
    entrypoint: ["relayfabric-ui"]
    command:
      - "--socket"
      - "/data/admin.sock"
      - "--web-dir"
      - "/opt/relayfabric/ui-web"
      - "--listen"
      - "0.0.0.0:8087"
      - "--no-auth"
    volumes:
      - relayfabric-data:/data
    ports:
      - "127.0.0.1:8087:8087"

  # Optional broker for the MQTT and Meshtastic (MQTT-gateway) plugins.
  # Remove this service if you point the plugins at an external broker.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "127.0.0.1:1883:1883"

volumes:
  relayfabric-data:
