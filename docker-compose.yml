# RelayFabric with an optional local MQTT broker.
#
#   mkdir -p config && cp docs/relayfabric.example.yaml config/relayfabric.yaml
#   # edit config/relayfabric.yaml: point plugin `command`s at the in-image
#   # paths (/opt/venv/bin/python /opt/relayfabric/plugins/<name>/relayfabric-<name>)
#   # and set node.data_dir: /data ; brokers reachable as mqtt://mosquitto:1883
#   docker compose up -d
#
# Inspect: docker compose exec switchyardd switchyardctl --socket /data/admin.sock status

services:
  switchyardd:
    build: .
    image: relayfabric:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
    volumes:
      - ./config:/config:ro     # your relayfabric.yaml
      - relayfabric-data:/data  # queue db, CAS attachments, admin.sock, plugin identities
    healthcheck:
      test: ["CMD", "switchyardctl", "--socket", "/data/admin.sock", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Federation listens on a TCP port only if you configure it; publish it here:
    # ports:
    #   - "8443:8443"

  # Optional web admin UI — reverse-proxies the daemon's admin socket with
  # WebAuthn/passkeys + RBAC. Shares the data volume to reach /data/admin.sock
  # (both services run as the image's `relayfabric` user, so the 0700 data
  # dir is open to the UI and nothing else).
  #
  # `--no-auth` here is for a LOCAL first look only: the port is published
  # on 127.0.0.1, but `--no-auth` means ANY client that reaches the listener
  # has full admin. That is why the service sits on its own `ui` network
  # that no other container joins: it needs no network path to the daemon
  # (the admin socket is on the shared volume), so mosquitto, the daemon,
  # and any container you add later cannot reach it with a forged Host
  # header. Only the host's loopback can.
  # For real/remote use drop --no-auth (the first-run setup token is then
  # written to /data/ui-state/setup-token: `docker compose exec relayfabric-ui
  # cat /data/ui-state/setup-token`), front it with TLS, and set --rp-id +
  # --allowed-host (see docs/webui-notes.md "Remote access").
  relayfabric-ui:
    image: relayfabric:latest
    restart: unless-stopped
    depends_on:
      - switchyardd
    entrypoint: ["relayfabric-ui"]
    command:
      - "--socket"
      - "/data/admin.sock"
      - "--web-dir"
      - "/opt/relayfabric/ui-web"
      - "--state-dir"
      - "/data/ui-state"
      - "--listen"
      - "0.0.0.0:8087"
      - "--no-auth"
    volumes:
      - relayfabric-data:/data
    networks:
      - ui
    ports:
      - "127.0.0.1:8087:8087"

  # Optional broker for the MQTT and Meshtastic (MQTT-gateway) plugins.
  # Remove this service if you point the plugins at an external broker.
  # The bundled no-auth config accepts anonymous publish/subscribe from
  # every container on the default network and from the host's loopback;
  # fine for this demo, but for anything else mount your own mosquitto.conf
  # with `allow_anonymous false` + a password_file and set the plugins'
  # broker credentials.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "127.0.0.1:1883:1883"

networks:
  # The UI's private network: no other service is attached to it, so the
  # unauthenticated listener is reachable only through the published
  # loopback port. (Not `internal: true` — Docker does not publish ports
  # for internal-only networks.)
  ui: {}

volumes:
  relayfabric-data:
