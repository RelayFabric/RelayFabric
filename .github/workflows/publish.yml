name: Publish

# Registry publishing (v0.4 cycle F):
# crates.io (relayfabric-core, then relayfabric-ipc — order matters) and PyPI
# (relayfabric-sdk), on version tags or manual dispatch. Both registries use
# OIDC Trusted Publishing — no long-lived tokens in repo secrets — which
# needs one-time registry-side setup (trusted publisher per crate/project +
# the crates-io/pypi GitHub environments). Every
# publish step is idempotent: already-published versions are skipped, so a
# re-run after a partial failure is safe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Both registries publish whatever version the manifests declare, and the
  # crates step silently skips a version that is already published, so a
  # tag that disagrees with Cargo.toml / pyproject.toml would either publish
  # the wrong version or do nothing without saying so. Fail early instead.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, Cargo.toml, and pyproject.toml must agree
        run: |
          set -euo pipefail
          cargo_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          sdk_version="$(python3 -c 'import tomllib; print(tomllib.load(open("sdk/python/pyproject.toml", "rb"))["project"]["version"])')"
          echo "Cargo.toml: $cargo_version  pyproject.toml: $sdk_version  ref: $GITHUB_REF_NAME"
          if [[ "$cargo_version" != "$sdk_version" ]]; then
            echo "::error::sdk/python/pyproject.toml version $sdk_version != Cargo.toml version $cargo_version"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$cargo_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $cargo_version"
            exit 1
          fi

  crates:
    needs: version
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Test the crates being published
        run: cargo test -j2 --locked -p relayfabric-core -p relayfabric-ipc

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish relayfabric-core then relayfabric-ipc
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          published() {
            curl -sf --retry 3 -A "relayfabric-ci (github.com/RelayFabric/RelayFabric)" \
              "https://crates.io/api/v1/crates/$1/versions" \
              | python3 -c "import json,sys; vs=json.load(sys.stdin).get('versions',[]); \
                            sys.exit(0 if any(v['num']=='$2' for v in vs) else 1)"
          }
          for crate in relayfabric-core relayfabric-ipc; do
            if published "$crate" "$version"; then
              echo "$crate $version already on crates.io — skipping"
              continue
            fi
            cargo publish --locked -p "$crate"
            # the next crate's publish resolves this one from the index;
            # poll until the registry serves it (usually seconds).
            for _ in $(seq 30); do
              published "$crate" "$version" && break
              sleep 10
            done
          done

  pypi:
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test the SDK being published
        working-directory: sdk/python
        run: |
          pip install cbor2 coincurve
          PYTHONPATH=. python -m unittest discover -s tests

      - name: Build sdist + wheel
        working-directory: sdk/python
        run: |
          # start from a clean tree: the publish step uploads everything in
          # dist/, so a stray local build artifact must never ride along
          rm -rf dist build ./*.egg-info
          pip install build
          python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/python/dist/
          # idempotent re-runs: an already-uploaded version is not an error
          skip-existing: true
