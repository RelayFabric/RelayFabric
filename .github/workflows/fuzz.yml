name: Fuzz

# Continuous fuzzing of the attacker-facing library decode surfaces (v0.4
# security review item 3): the Plugin Protocol frame codec and the canonical
# Envelope decode. Runs weekly and on demand — deliberately NOT a PR gate;
# a libfuzzer session is time-bounded exploration, not a determinate check.
# unseal/fed-wire targets follow the Phase-2 relayfabric-core extraction.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [frame_decode, envelope_decode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly, 2026-10-16
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/relay-ipc/fuzz
          key: fuzz-${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }} (10 minutes)
        working-directory: crates/relay-ipc
        # Tracked seeds (fuzz/seeds/<target>) are fed alongside the cached
        # corpus so forward-compat cases such as an unknown frame tag stay
        # in the explored set; the corpus dir itself is cache-only.
        #
        # This is a public repository, so the job log and its artifacts are
        # public too, and a crashing input is a ready-made exploit against
        # every deployed node until the fix ships. The fuzzer's output goes
        # to a file; only the crash class reaches the log, never the input
        # bytes cargo-fuzz would otherwise print.
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          seeds=""
          [ -d fuzz/seeds/${{ matrix.target }} ] && seeds=fuzz/seeds/${{ matrix.target }}
          status=0
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} $seeds -- -max_total_time=600 > fuzz.log 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "fuzz target ${{ matrix.target }} failed (exit $status); crash class:"
            grep -E -A1 'panicked at|ERROR: libFuzzer|SUMMARY:|Test unit written to' fuzz.log || true
          else
            grep -E 'Done [0-9]+ runs' fuzz.log | tail -n 1 || true
          fi
          exit "$status"
      - name: Encrypt crash artifacts for the maintainer
        # Set the FUZZ_AGE_RECIPIENT repository variable to an age public key
        # (age1...) to receive reproducers; without it nothing is uploaded.
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        env:
          AGE_RECIPIENT: ${{ vars.FUZZ_AGE_RECIPIENT }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          tar -C crates/relay-ipc/fuzz -cf - artifacts | age -r "$AGE_RECIPIENT" -o fuzz-crashes.tar.age
      - name: Upload encrypted crash artifacts
        if: failure() && vars.FUZZ_AGE_RECIPIENT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz-crashes.tar.age
          if-no-files-found: ignore
