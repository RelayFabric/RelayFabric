name: Release

# Packaged releases (v0.4 cycle D + cosign signing): on a version tag, build
# the Rust binaries for x86-64 and aarch64 and package tarballs + a .deb per
# arch; then one signing job creates a unified checksums.txt, signs every
# artifact (and the checksums file itself) with keyless Sigstore cosign,
# generates GitHub build-provenance attestations, attaches everything to the
# tag's release, and appends verification instructions to the release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p relayfabric-ui

      - name: Package tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="relayfabric-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          for bin in switchyardd switchyardctl relayfabric-mqtt relayfabric-ui; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$PKG/"
          done
          cp LICENSE README.md docs/relayfabric.example.yaml "dist/$PKG/"
          cp -r deploy "dist/$PKG/deploy"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          rm -r "dist/$PKG"

      - name: Build .deb
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          # The deb metadata's asset paths point at target/release/; both
          # matrix runners are native (x86-64 and arm), so the host arch is
          # the package arch and no --target indirection is needed.
          mkdir -p target/release
          for bin in switchyardd switchyardctl relayfabric-mqtt; do
            cp "target/${{ matrix.target }}/release/$bin" target/release/
          done
          cargo deb -p switchyardd --no-build --no-strip --output dist/

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sign-and-attach:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Unified checksums
        working-directory: artifacts
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts with cosign (keyless)
        working-directory: artifacts
        run: |
          set -euo pipefail
          for file in *.tar.gz *.deb; do
            [ -f "$file" ] || continue
            echo "Signing $file..."
            cosign sign-blob --yes "$file" \
              --output-signature "${file}.sig" --output-certificate "${file}.pem"
          done
          # the checksums manifest is signed too
          cosign sign-blob --yes checksums.txt \
            --output-signature checksums.txt.sig --output-certificate checksums.txt.pem

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb

      - name: Attach to release and append verification notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber \
            -R "$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --json body -q .body > body.md
          cat >> body.md <<'EOF'

          ### Verification

          SHA256 checksums are in `checksums.txt` (itself signed). Every
          tarball and `.deb` is signed with keyless
          [Sigstore cosign](https://docs.sigstore.dev/); verify with:

          ```bash
          cosign verify-blob --certificate <file>.pem --signature <file>.sig <file> \
            --certificate-identity-regexp="https://github.com/RelayFabric/RelayFabric" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          ```

          GitHub build-provenance attestations are also available:
          `gh attestation verify <file> -R RelayFabric/RelayFabric`.
          EOF
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --notes-file body.md
