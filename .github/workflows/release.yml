name: Release

# Packaged releases (v0.4 cycle D + cosign signing): on a version tag, build
# the Rust binaries for x86-64 and aarch64 and package tarballs + a .deb per
# arch; then one signing job creates a unified checksums.txt, signs every
# artifact (and the checksums file itself) with keyless Sigstore cosign,
# generates GitHub build-provenance attestations, attaches everything to the
# tag's release, and appends verification instructions to the release notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # CI runs on branch pushes, not tags, so nothing else checks the exact
  # commit being packaged. Same gate as ci.yml's rust job (fmt, clippy with
  # warnings denied, the workspace test suite), plus the tag/version
  # consistency check: tarballs, the .deb, and the registry publishes all
  # take the version from Cargo.toml, so a tag that disagrees with it would
  # produce mislabeled artifacts. -j2 is the repo-wide cargo convention.
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag must match the workspace version
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          echo "workspace version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy -j2 --locked --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test -j2 --locked --workspace

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: |
          cargo build -j2 --locked --release --target ${{ matrix.target }}
          cargo build -j2 --locked --release --target ${{ matrix.target }} -p relayfabric-ui

      - name: Package tarball
        run: |
          set -euo pipefail
          # the same version the .deb and the registry publishes use (the
          # test job already asserted the tag agrees with it)
          VERSION="${{ needs.test.outputs.version }}"
          PKG="relayfabric-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          for bin in switchyardd switchyardctl relayfabric-mqtt relayfabric-ui; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$PKG/"
          done
          cp LICENSE README.md docs/relayfabric.example.yaml "dist/$PKG/"
          cp -r deploy "dist/$PKG/deploy"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          rm -r "dist/$PKG"

      - name: Build .deb
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          # The deb metadata's asset paths point at target/release/; both
          # matrix runners are native (x86-64 and arm), so the host arch is
          # the package arch and no --target indirection is needed.
          mkdir -p target/release
          for bin in switchyardd switchyardctl relayfabric-mqtt; do
            cp "target/${{ matrix.target }}/release/$bin" target/release/
          done
          cargo deb -p switchyardd --no-build --no-strip --output dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sign-and-attach:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: binaries-*
          merge-multiple: true

      - name: Unified checksums
        working-directory: artifacts
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # cosign v3 (the installer default since v4) makes sign-blob emit
          # Sigstore bundles instead of .sig/.pem pairs; moving to it means
          # changing the verify instructions below too, so stay on v2 for now.
          cosign-release: v2.6.1

      - name: Sign artifacts with cosign (keyless)
        working-directory: artifacts
        run: |
          set -euo pipefail
          for file in *.tar.gz *.deb; do
            [ -f "$file" ] || continue
            echo "Signing $file..."
            cosign sign-blob --yes "$file" \
              --output-signature "${file}.sig" --output-certificate "${file}.pem"
          done
          # the checksums manifest is signed too
          cosign sign-blob --yes checksums.txt \
            --output-signature checksums.txt.sig --output-certificate checksums.txt.pem

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.deb

      - name: Attach to release and append verification notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber \
            -R "$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --json body -q .body > body.md
          # Idempotent: append the Verification section only once. A re-run of
          # this job would otherwise append a second (third, ...) copy. Prose
          # lines are kept unwrapped so GitHub (which renders a single newline
          # as a line break in release notes) doesn't show ragged mid-sentence
          # breaks.
          if grep -q '^### Verification' body.md; then
            echo "verification section already present; leaving notes as-is"
          else
          cat >> body.md <<'EOF'

          ### Verification

          SHA256 checksums are in `checksums.txt` (itself signed). Every tarball and `.deb` is signed with keyless [Sigstore cosign](https://docs.sigstore.dev/); verify with:

          ```bash
          cosign verify-blob --certificate <file>.pem --signature <file>.sig <file> \
            --certificate-identity-regexp='^https://github\.com/RelayFabric/RelayFabric/\.github/workflows/release\.yml@refs/tags/v[0-9]+(\.[0-9]+)*$' \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          ```

          GitHub build-provenance attestations are also available: `gh attestation verify <file> -R RelayFabric/RelayFabric`.
          EOF
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --notes-file body.md
          fi
