name: CI

# The mandatory merge gate (v0.4 cycle A): formatting, clippy with warnings
# denied, the full Rust workspace test suite (which includes the golden IPC
# wire vectors), every Python plugin suite plus the SDK suite, the formal
# model of the SDK send queue, and the dependency policy/vulnerability
# audit. The container build lives in docker.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy -j2 --locked --workspace --all-targets -- -D warnings
      - name: tests (includes golden IPC vectors)
        run: cargo test -j2 --locked --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: install plugin + sdk dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cbor2 paho-mqtt coincurve meshcore rns lxmf
      - name: sdk suite
        working-directory: sdk/python
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: plugin suites
        run: |
          for t in plugins/*/test_*.py; do
            echo "== $t"
            python "$t"
          done
      - name: pip-audit (advisory, non-blocking)
        # Python-side twin of the audit job's cargo-audit: scans the
        # installed plugin/SDK dependency set for known vulnerabilities.
        # Advisory-only for the same reason -- an upstream CVE must not
        # wedge unrelated PRs. Flip to blocking with triage habits.
        run: |
          pip install pip-audit
          pip-audit || true

  formal:
    # The TLA+ model of the SDK send queue; its record is VERIFY.md in
    # $FORMAL. Fails when the covered lines of runner.py changed without a
    # re-sync of that record, when the model breaks a rule, when a
    # deliberate fault no longer breaks its rule, or when the model cannot
    # follow a log of the real run_plugin.
    runs-on: ubuntu-latest
    env:
      FORMAL: sdk/python/formal/send_queue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # so a drift failure can list the commits since the last sync
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: break patches still apply
        # The faults in the real code that VERIFY.md keeps for the trace
        # check; a change to runner.py must not leave them behind.
        run: |
          for p in "$FORMAL"/breaks/*.patch; do
            git apply --check "$p"
          done
      - name: write trace logs from the real run_plugin
        run: |
          pip install cbor2
          python "$FORMAL/trace_run.py" "$RUNNER_TEMP/send_queue"
      - uses: jaschadub/skill-formal-proofs@9b0ebed963ab17e50da2fd9b0201962ef097f55a # v0.4.0
        with:
          specs: ${{ env.FORMAL }}/SendQueue.tla
          # The fault table of VERIFY.md, one entry per row.
          faults: >-
            ${{ env.FORMAL }}/SendQueue.tla:NoDedup=OneSendPerCorr
            ${{ env.FORMAL }}/SendQueue.tla:EarlyRelease=OneSendPerCorr
            ${{ env.FORMAL }}/SendQueue.tla:NoLock=NoStuckCorr
            ${{ env.FORMAL }}/SendQueue.tla:NoRelease=NoStuckCorr
            ${{ env.FORMAL }}/SendQueue.tla:ReserveOnFull=NoStuckCorr
            ${{ env.FORMAL }}/SendQueue.tla:Lifo=InOrder
            ${{ env.FORMAL }}/SendQueue.tla:Lifo=DrainedAtStop
            ${{ env.FORMAL }}/SendQueue.tla:StopJumpsQueue=DrainedAtStop
            ${{ env.FORMAL }}/SendQueue.tla:NoBusy=BusyAnswered
            ${{ env.FORMAL }}/SendQueue.tla:NoBound=Bounded
            ${{ env.FORMAL }}/SendQueue.tla:CloseWaits=CloseNeverWaits
          traces: >-
            ${{ env.FORMAL }}/SendQueueTrace.tla=${{ runner.temp }}/send_queue/redispatch.log
            ${{ env.FORMAL }}/SendQueueTrace.tla=${{ runner.temp }}/send_queue/overflow.log
            ${{ env.FORMAL }}/SendQueueTrace.tla=${{ runner.temp }}/send_queue/free_running.log
            ${{ env.FORMAL }}/SendQueueTrace.tla=${{ runner.temp }}/send_queue/connection_lost.log
            ${{ env.FORMAL }}/SendQueueTrace.tla=${{ runner.temp }}/send_queue/join_timeout.log
            ${{ env.FORMAL }}/SendQueueTrace.tla=${{ runner.temp }}/send_queue/shutdown_when_full.log

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked
      - name: license + source policy, security advisories
        run: cargo deny --locked check licenses sources advisories
      - name: cargo audit (advisory, non-blocking)
        # Advisory-only for now: an upstream CVE in a transitive dep must
        # not wedge unrelated PRs. Flip to blocking once triage habits
        # exist (v0.4 roadmap, cycle A note).
        run: cargo audit || true
