name: CI

# The mandatory merge gate (v0.4 cycle A): formatting, clippy with warnings
# denied, the full Rust workspace test suite (which includes the golden IPC
# wire vectors), every Python plugin suite plus the SDK suite, and the
# dependency policy/vulnerability audit. The container build lives in
# docker.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy (warnings are errors)
        run: cargo clippy -j2 --locked --workspace --all-targets -- -D warnings
      - name: tests (includes golden IPC vectors)
        run: cargo test -j2 --locked --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: install plugin + sdk dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cbor2 paho-mqtt coincurve meshcore rns lxmf
      - name: sdk suite
        working-directory: sdk/python
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: plugin suites
        run: |
          for t in plugins/*/test_*.py; do
            echo "== $t"
            python "$t"
          done
      - name: pip-audit (advisory, non-blocking)
        # Python-side twin of the audit job's cargo-audit: scans the
        # installed plugin/SDK dependency set for known vulnerabilities.
        # Advisory-only for the same reason -- an upstream CVE must not
        # wedge unrelated PRs. Flip to blocking with triage habits.
        run: |
          pip install pip-audit
          pip-audit || true

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install cargo-deny and cargo-audit
        run: cargo install cargo-deny cargo-audit --locked
      - name: license + source policy, security advisories
        run: cargo deny --locked check licenses sources advisories
      - name: cargo audit (advisory, non-blocking)
        # Advisory-only for now: an upstream CVE in a transitive dep must
        # not wedge unrelated PRs. Flip to blocking once triage habits
        # exist (v0.4 roadmap, cycle A note).
        run: cargo audit || true
