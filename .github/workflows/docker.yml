name: Docker

# Builds the RelayFabric image on every commit and PR; on pushes to main it
# also publishes to the GitHub Container Registry (ghcr.io). Runs on the
# GitHub mirror of the canonical git.dx.pe repository.
# No paths filters: this job is the repo's only compile gate, so it runs on
# every push/PR rather than risking a skipped build on a path the twin
# filter lists forgot.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/relayfabric/relayfabric
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Publish only on pushes to main; PRs from forks can't access packages.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
