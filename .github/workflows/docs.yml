name: Documentation

# Builds the zensical documentation site and deploys it to GitHub Pages.
# The canonical repo is git.dx.pe; this runs on the GitHub mirror, which is
# where Pages is served from. Enable Pages (Settings -> Pages -> Source:
# GitHub Actions) once on the mirror for the deploy step to publish.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'MANIFESTO.md'   # rendered at docs/manifesto.md (symlink)
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Create the Pages site on first run instead of requiring it to be
          # enabled by hand in Settings -> Pages first.
          enablement: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
