name: Documentation

# Builds the zensical documentation site and deploys it to GitHub Pages.
# The canonical repo is git.dx.pe; this runs on the GitHub mirror, which is
# where Pages is served from. Enable Pages (Settings -> Pages -> Source:
# GitHub Actions) once on the mirror for the deploy step to publish.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first run instead of requiring it to be
          # enabled by hand in Settings -> Pages first.
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
