name: Documentation

# Builds the zensical documentation site and deploys it to GitHub Pages.
# The canonical repo is git.dx.pe; this runs on the GitHub mirror, which is
# where Pages is served from. Enable Pages (Settings -> Pages -> Source:
# GitHub Actions) once on the mirror for the deploy step to publish.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'MANIFESTO.md'   # rendered at docs/manifesto.md (symlink)
      - 'zensical.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          # Create the Pages site on first run instead of requiring it to be
          # enabled by hand in Settings -> Pages first.
          enablement: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
