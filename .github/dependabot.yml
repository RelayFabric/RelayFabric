# Weekly dependency update PRs. Every action in .github/workflows is pinned
# to a commit SHA (with the release tag in a trailing comment), so the
# github-actions ecosystem is what keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
