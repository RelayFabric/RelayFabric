# Weekly dependency update PRs. Every action in .github/workflows is pinned
# to a commit SHA (with the release tag in a trailing comment), so the
# github-actions ecosystem is what keeps those pins current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The dalek and rand set moves together: ed25519-dalek 3 and
      # curve25519-dalek 5 are the new rand_core generation, while snow 0.10
      # and crypto_box still sit on curve25519-dalek 4 and rand_core 0.6, so
      # bumping any one of them alone splits the tree into two copies. Lift
      # once snow moves.
      - dependency-name: rand
        versions: [">=0.9"]
      - dependency-name: curve25519-dalek
        versions: [">=5"]
      - dependency-name: ed25519-dalek
        versions: [">=3"]
      # sha2 0.11 and hmac 0.13 are the digest 0.11 generation; p256 0.14 and
      # ed25519-dalek 2 still build on digest 0.10, so these move with them.
      - dependency-name: sha2
        versions: [">=0.11"]
      - dependency-name: hmac
        versions: [">=0.13"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The interpreter minor is chosen by hand (the plugins' native deps
      # need prebuilt wheels for it); digest refreshes of 3.12 still flow.
      - dependency-name: python
        versions: [">=3.13"]
  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
